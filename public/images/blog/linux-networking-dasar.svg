</text>
<text x="270" y="418" font-size="11" font-family="monospace" fill="rgba(251,191,36,0.8)" letter-spacing="0.03em">
$ ping -c 4 google.com
</text>
<text x="290" y="436" font-size="9" font-family="monospace" fill="rgba(251,191,36,0.3)" letter-spacing="0.03em">
64 bytes from google.com: icmp_seq=1 ttl=116 time=14.2 ms
</text>
<text x="270" y="478" font-size="11" font-family="monospace" fill="rgba(251,191,36,0.8)" letter-spacing="0.03em">
$ iptables -L -n
</text>
<text x="290" y="496" font-size="9" font-family="monospace" fill="rgba(251,191,36,0.3)" letter-spacing="0.03em">
