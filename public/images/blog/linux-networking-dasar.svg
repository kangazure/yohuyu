</text>
<text x="270" y="358" font-size="11" font-family="monospace" fill="rgba(251,191,36,0.8)" letter-spacing="0.03em">
$ resolvectl status
</text>
<text x="290" y="376" font-size="9" font-family="monospace" fill="rgba(251,191,36,0.3)" letter-spacing="0.03em">
DNS Servers: 8.8.8.8
</text>
<text x="290" y="391" font-size="9" font-family="monospace" fill="rgba(251,191,36,0.3)" letter-spacing="0.03em">
