</text>
<text x="270" y="238" font-size="11" font-family="monospace" fill="rgba(251,191,36,0.8)" letter-spacing="0.03em">
$ ss -tuln | grep LISTEN
</text>
<text x="290" y="256" font-size="9" font-family="monospace" fill="rgba(251,191,36,0.3)" letter-spacing="0.03em">
tcp  LISTEN  0  128  0.0.0.0:22  *:*
</text>
<text x="270" y="298" font-size="11" font-family="monospace" fill="rgba(251,191,36,0.8)" letter-spacing="0.03em">
$ route -n
</text>
<text x="290" y="316" font-size="9" font-family="monospace" fill="rgba(251,191,36,0.3)" letter-spacing="0.03em">
Kernel IP routing table
</text>
<text x="290" y="331" font-size="9" font-family="monospace" fill="rgba(251,191,36,0.3)" letter-spacing="0.03em">
