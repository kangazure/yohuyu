<text x="370" y="134" font-size="12" font-family="monospace" fill="rgba(251,191,36,0.5)" letter-spacing="0.03em">
user@linux:~$
</text>
<text x="270" y="178" font-size="11" font-family="monospace" fill="rgba(251,191,36,0.8)" letter-spacing="0.03em">
$ ip addr show
</text>
<text x="290" y="196" font-size="9" font-family="monospace" fill="rgba(251,191,36,0.3)" letter-spacing="0.03em">
eth0: <BROADCAST,MULTICAST,UP,LOWER_UP>
</text>
<text x="290" y="211" font-size="9" font-family="monospace" fill="rgba(251,191,36,0.3)" letter-spacing="0.03em">
